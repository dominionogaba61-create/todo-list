<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>To-do list</title>
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#1d2733;--mute:#7a8794;--line:#dde3e9;--accent:#2f6f6b;--done:#a9b4be;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12181e;--card:#1a232c;--ink:#e6ebf0;--mute:#8896a3;--line:#2a3541;--accent:#5fb3ab;--done:#566472}}
:root[data-theme="dark"]{--bg:#12181e;--card:#1a232c;--ink:#e6ebf0;--mute:#8896a3;--line:#2a3541;--accent:#5fb3ab;--done:#566472}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Trebuchet MS","Segoe UI",system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:32px 16px 64px}
h1{font-size:2rem;margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--mute);margin:0 0 20px}
form{display:flex;gap:8px;margin-bottom:16px}
input[type=text]{flex:1;min-width:0;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
button{font:inherit;cursor:pointer}
.add{padding:0 18px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-weight:600}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--mute)}
.tabs button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
ul{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:10px}
li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
li:last-child{border-bottom:0}
li input{width:20px;height:20px;accent-color:var(--accent);flex:none}
li span{flex:1;overflow-wrap:anywhere}
li.done span{color:var(--done);text-decoration:line-through}
li .del{border:0;background:transparent;color:var(--mute);font-size:1.3rem;line-height:1;padding:4px 8px}
li .del:hover{color:#c0392b}
.empty{padding:28px 14px;text-align:center;color:var(--mute)}
footer{display:flex;justify-content:space-between;align-items:center;margin-top:12px;color:var(--mute);font-size:.9rem}
footer button{border:0;background:transparent;color:var(--accent);text-decoration:underline}
</style>
</head>
<body>
<main>
<h1>To-do list</h1>
<p class="sub">Add a task, tick it off when it's done.</p>
<form id="f"><input id="t" type="text" placeholder="What needs doing?" aria-label="New task" autocomplete="off"><button class="add">Add task</button></form>
<div class="tabs" id="tabs">
<button data-f="all" aria-pressed="true">All</button><button data-f="open" aria-pressed="false">Open</button><button data-f="done" aria-pressed="false">Done</button>
</div>
<ul id="list"></ul>
<footer><span id="count"></span><button id="clear">Clear completed</button></footer>
</main>
<script>
var tasks=[],filter="all",KEY="todo-list-v1";
try{tasks=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){tasks=[]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks))}catch(e){}}
function render(){
 var list=document.getElementById("list");list.innerHTML="";
 var shown=tasks.filter(function(t){return filter==="all"||(filter==="done")===t.done});
 if(!shown.length){var li=document.createElement("li");li.className="empty";li.textContent=tasks.length?"No tasks in this view.":"No tasks yet. Add your first one above.";li.style.justifyContent="center";list.appendChild(li)}
 shown.forEach(function(t){
  var li=document.createElement("li");if(t.done)li.className="done";
  var c=document.createElement("input");c.type="checkbox";c.checked=t.done;c.setAttribute("aria-label","Mark done");
  c.onchange=function(){t.done=c.checked;save();render()};
  var s=document.createElement("span");s.textContent=t.text;
  var d=document.createElement("button");d.className="del";d.textContent="\u00d7";d.setAttribute("aria-label","Delete task");
  d.onclick=function(){tasks=tasks.filter(function(x){return x!==t});save();render()};
  li.append(c,s,d);list.appendChild(li)});
 var open=tasks.filter(function(t){return!t.done}).length;
 document.getElementById("count").textContent=open+(open===1?" task":" tasks")+" left";
}
document.getElementById("f").onsubmit=function(e){e.preventDefault();var i=document.getElementById("t"),v=i.value.trim();if(!v)return;tasks.unshift({text:v,done:false});i.value="";save();render()};
document.getElementById("tabs").onclick=function(e){var b=e.target.closest("button");if(!b)return;filter=b.dataset.f;[].forEach.call(this.children,function(x){x.setAttribute("aria-pressed",x===b)});render()};
document.getElementById("clear").onclick=function(){tasks=tasks.filter(function(t){return!t.done});save();render()};
render();
</script>
</body>
</html>
